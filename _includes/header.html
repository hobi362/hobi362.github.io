<header class="sheet-header">
  <div class="sheet-header__inner">
    <a class="sheet-header__mark" href="{{ '/' | relative_url }}">
      <span class="mark-code">RE-{{ site.github_username | slugify | upcase | truncate: 6, "" }}</span>
      <span class="mark-name">{{ site.title | split: "—" | first }}</span>
    </a>
    <nav class="sheet-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research/' %}aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/experience/' | relative_url }}" {% if page.url contains '/experience/' %}aria-current="page"{% endif %}>Experience</a>
      <a href="{{ '/coursework/' | relative_url }}" {% if page.url contains '/coursework/' %}aria-current="page"{% endif %}>Coursework</a>
      <a href="{{ '/publications/' | relative_url }}" {% if page.url contains '/publications/' %}aria-current="page"{% endif %}>Publications</a>
      <a href="{{ '/awards/' | relative_url }}" {% if page.url contains '/awards/' %}aria-current="page"{% endif %}>Awards</a>
      <a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact/' %}aria-current="page"{% endif %}>Contact</a>
      {% if site.resume_pdf %}<a href="{{ site.resume_pdf | relative_url }}" target="_blank" rel="noopener">Resume ↗</a>{% endif %}
      {% if site.cv_pdf %}<a href="{{ site.cv_pdf | relative_url }}" target="_blank" rel="noopener">CV ↗</a>{% endif %}
    </nav>
    <button class="sheet-nav__toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
