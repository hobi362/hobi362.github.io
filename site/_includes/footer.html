<footer class="sheet-footer">
  <div class="sheet-footer__inner">
    <div class="rev-block">
      <div class="rev-block__row rev-block__row--head">
        <span>REV</span><span>DESCRIPTION</span><span>DATE</span>
      </div>
      <div class="rev-block__row">
        <span>A</span><span>Site initialized</span><span>{{ site.time | date: "%Y-%m" }}</span>
      </div>
    </div>
    <div class="footer-links">
      <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub ↗</a>
      <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn ↗</a>
      {% if site.resume_pdf %}<a href="{{ site.resume_pdf | relative_url }}" target="_blank" rel="noopener">Resume (PDF) ↗</a>{% endif %}
    </div>
    <p class="footer-note">Built as a static Jekyll site, hosted on GitHub Pages.</p>
  </div>
</footer>
