title: "Rachel Hoffman-Bice — Mechanical Engineer"
tagline: "Mechanical design · Robotics & controls · Medical devices"
description: >-
  Portfolio of Rachel Hoffman-Bice — mechanical design, robotics and controls,
  and medical device engineering, spanning MIT research, industry, and coursework.
# email: ""   # no public email by choice - contact via LinkedIn
github_username: hobi362
linkedin_url: "https://www.linkedin.com/in/rachelhoffmanbice/"
resume_pdf: "/assets/files/resume.pdf"
cv_pdf: "/assets/files/cv.pdf"

# Where this builds. GitHub auto-builds this repo (username.github.io)
# with Jekyll on every push to main — no Actions/workflow needed.
url: "https://hobi362.github.io"
baseurl: ""

markdown: kramdown
theme_skip: true          # we are NOT using a gem-based theme, all custom
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  research:
    output: true
    permalink: /research/:path/
  projects:
    output: true
    permalink: /projects/:path/
  experience:
    output: true
    permalink: /experience/:path/
  writeups:
    output: true
    permalink: /projects/t-based-lathe/writeups/:name/
  seekgeeks:
    output: true
    permalink: /miscellaneous/seek-and-geek/:name/

defaults:
  - scope:
      path: ""
      type: "research"
    values:
      layout: "research"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "experience"
    values:
      layout: "experience"

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
