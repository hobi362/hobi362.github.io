# One index of skills and stack. This file drives three things:
#   1. the /skills/ page (Skills & Stack)
#   2. the Skills and Stack chip rows on every project, research and experience page
#   3. the filter bar on /projects/
#
# kind: skill  = a capability (what she can do)
# kind: stack  = the specific thing used (software, hardware, mechanism, method, standard)
#
# Every entry appears exactly once, so a skill and a stack item can never duplicate each
# other. Pages carry no `tags:` -- membership lives only here.
#
# Fields: id (anchor + filter value, do not change once published), name, short (chip
# label), kind, group, summary, filter (offer as a chip on /projects/), pages.

